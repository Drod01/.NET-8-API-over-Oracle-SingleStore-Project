name: wellhead-dotnet

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: wellhead
      APP_USER_PASSWORD: wellhead
    ports:
      - "1521:1521"
    volumes:
      - ./db/oracle:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 40

  singlestore:
    image: memsql/cluster-in-a-box:latest
    environment:
      START_AFTER_INIT: "Y"
      SA_PASSWORD: "Wellhead-1"
      MYSQL_ROOT_PASSWORD: "Wellhead-1"
    ports:
      - "3306:3306"
      - "8080:8080"
    volumes:
      - ./db/singlestore:/init:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 15s
      timeout: 5s
      retries: 40

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    depends_on:
      oracle:
        condition: service_healthy
      singlestore:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Oracle: "User Id=wellhead;Password=wellhead;Data Source=oracle:1521/FREEPDB1"
      ConnectionStrings__SingleStore: "Server=singlestore;Port=3306;Database=wellhead;User=root;Password=Wellhead-1"
      Kafka__BootstrapServers: "redpanda:9092"
      Kafka__Topic: "well.telemetry"
      Kafka__GroupId: "wellhead-api"
    ports:
      - "8080:8080"
